[project]
name = "crypto-data-fetcher"
version = "0.1.0"
description = "A tool to fetch cryptocurrency data from Yahoo Finance and store it in PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.18",
    "pandas>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
]
